<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Snake Arena 2D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }
    #hud {
      width: 1400px;
      max-width: 96vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .hud-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    .icon-btn:hover {
      background: #334155;
    }
    #game-wrapper {
      position: relative;
      width: 1400px;
      max-width: 96vw;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #0b1120;
    }
    /* Quando em Tela Cheia ocupa 100% do monitor */
    #game-wrapper:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      border: none;
      border-radius: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    #ranking {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 215px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      pointer-events: none;
    }
    #ranking h4 {
      margin: 0 0 8px 0;
      color: #facc15;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #rank-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }
    #rank-list li {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }
    .rank-me {
      color: #38bdf8;
      font-weight: bold;
    }
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    #start-screen h1 {
      margin: 0;
      font-size: 42px;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }
    #death-msg {
      color: #f87171;
      font-size: 18px;
      font-weight: bold;
      margin: 0;
    }
    #nickname-input {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 6px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #fff;
      text-align: center;
      outline: none;
      width: 260px;
    }
    #nickname-input:focus {
      border-color: #38bdf8;
    }
    #color-picker {
      display: flex;
      gap: 10px;
      margin: 4px 0;
    }
    .color-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-btn:hover {
      transform: scale(1.15);
    }
    .color-btn.selected {
      border-color: #ffffff;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }
    #start-btn {
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      color: #090d16;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    #start-btn:hover {
      background: #4ade80;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="hud">
    <span id="score-display">Pontos: 0 | Tamanho: 20</span>
    <span style="color: #f87171;">⚠️ Cuidado com a parede vermelha! </span>
    <div class="hud-controls">
      <span id="hp-display" style="margin-right: 10px;">Vida: 100%</span>
      <button id="mute-btn" class="icon-btn">🔊 Som: ON</button>
      <button id="fullscreen-btn" class="icon-btn">⛶ Tela Cheia</button>
    </div>
  </div>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="1400" height="820"></canvas>

    <div id="ranking">
      <h4>🏆 Ranking</h4>
      <ul id="rank-list"></ul>
    </div>

    <div id="start-screen">
      <h1>🐍 SNAKE ARENA</h1>
      <p id="death-msg" style="display: none;"></p>
      <input type="text" id="nickname-input" placeholder="Seu apelido..." maxlength="14" />

      <div id="color-picker">
        <button type="button" class="color-btn selected" data-hue="135" style="background: hsl(135, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="200" style="background: hsl(200, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="0" style="background: hsl(0, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="45" style="background: hsl(45, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="280" style="background: hsl(280, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="330" style="background: hsl(330, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="25" style="background: hsl(25, 85%, 55%);"></button>
        <button type="button" class="color-btn" data-hue="175" style="background: hsl(175, 85%, 55%);"></button>
      </div>

      <button id="start-btn">INICIAR JOGO</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
